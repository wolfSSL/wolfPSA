name: Test PSA API

on:
  push:
  pull_request:

jobs:
  # The baseline user_settings.h enables neither HAVE_ECC_KOBLITZ nor
  # HAVE_ECC_BRAINPOOL, so the ECC curve-pinning regression tests would
  # run without those families. This lane rebuilds the library and the
  # two curve tests with both curve families enabled, so the secp256k1
  # and Brainpool-P256 paths get real coverage. libwolfpsa.so exports
  # only the psa_* API and keeps its wolfCrypt objects local, so the
  # curve operations run on the variant wolfCrypt compiled into the
  # library itself; the sibling wolfSSL only provides the link.
  test-ecc-curve-families:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # master tracks upstream; the -stable tag is the release wolfPSA is
        # validated against. Bump it together with the wolfPSA version.
        wolfssl-ref: [ master, v5.9.4-stable ]

    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v4

      - name: Clone sibling wolfSSL
        run: git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} https://github.com/wolfSSL/wolfssl ../wolfssl

      - name: Build variant user_settings (Koblitz + Brainpool)
        run: |
          mkdir -p build-ecc-var
          cp user_settings.h build-ecc-var/baseline_user_settings.h
          cat > build-ecc-var/user_settings.h <<'EOF'
          /* wolfCrypt dependency: HAVE_ECC_BRAINPOOL requires
           * WOLFSSL_CUSTOM_CURVES. */
          #define WOLFSSL_CUSTOM_CURVES
          #define HAVE_ECC_KOBLITZ
          #define HAVE_ECC_BRAINPOOL
          #include "baseline_user_settings.h"
          EOF

      - name: Build wolfPSA with the variant
        # Absolute path: make -C test runs with CWD=test/, where a
        # relative USER_SETTINGS_PATH would silently resolve to the
        # repo-root baseline user_settings.h.
        run: make USER_SETTINGS_PATH="${GITHUB_WORKSPACE}/build-ecc-var"

      - name: Build sibling wolfSSL for wolfPSA tests
        run: make -C test rebuild-wolfssl-psa

      - name: Build and run the ECC curve tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}:${{ github.workspace }}/../wolfssl/src/.libs
        run: |
          make -C test USER_SETTINGS_PATH="${GITHUB_WORKSPACE}/build-ecc-var" \
            psa_ecc_verify_curve_test psa_ecc_ecdh_curve_test
          ./test/psa_ecc_verify_curve_test
          ./test/psa_ecc_ecdh_curve_test

      - name: Run the PSA_WANT surface test
        run: |
          make want-surface-test \
            USER_SETTINGS_PATH="${GITHUB_WORKSPACE}/build-ecc-var"

  test-psa-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # master tracks upstream; the -stable tag is the release wolfPSA is
        # validated against. Bump it together with the wolfPSA version.
        wolfssl-ref: [ master, v5.9.4-stable ]
        # MBEDTLS_COMPAT=1 needs wolfSSL master
        include:
          - wolfssl-ref: v5.9.4-stable
            make-args: MBEDTLS_COMPAT=0

    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v4

      - name: Clone sibling wolfSSL
        run: git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} https://github.com/wolfSSL/wolfssl ../wolfssl

      - name: Build wolfPSA
        run: make

      - name: Build sibling wolfSSL for wolfPSA tests
        run: make -C test rebuild-wolfssl-psa

      - name: Build and run the PSA API tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}:${{ github.workspace }}/../wolfssl/src/.libs
        run: make unit-run ${{ matrix.make-args }}

      # The crypto callback reads the HMAC key out of Hmac.keyRaw, which
      # wolfCrypt borrows rather than copies. Only a sanitizer notices when
      # the operation outlives that buffer.
      - name: Run the devId test under AddressSanitizer
        run: |
          make -C test psa_devid_cryptocb_test ASAN=1
          rm -rf .store test/.store
          ./test/psa_devid_cryptocb_test

      # LeakSanitizer checks that failed key file loads free their buffer
      - name: Run the pk test under AddressSanitizer
        run: |
          rm -f test/psa_tf_psa_pk_test test/psa_server/psa_tf_psa_pk_test.o
          make -C test psa_tf_psa_pk_test ASAN=1
          ./test/psa_tf_psa_pk_test
