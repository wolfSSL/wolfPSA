name: wolfCrypt Benchmark

on:
  push:
  pull_request:

jobs:
  wolfcrypt-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # master tracks upstream; the -stable tag is the release wolfPSA is
        # validated against. Bump it together with the wolfPSA version.
        wolfssl-ref: [ master, v5.9.4-stable ]

    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v4

      - name: Clone sibling wolfSSL
        run: git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} https://github.com/wolfSSL/wolfssl ../wolfssl

      - name: Build wolfPSA
        run: make

      - name: Build wolfCrypt benchmark test
        run: make -C test wolfcrypt-psa-benchmark

      - name: Run wolfCrypt benchmark test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
          WOLFPSA_LIB: ${{ github.workspace }}/libwolfpsa.so
        run: |
          ./test/wolfcrypt-psa-benchmark -?
          ./test/wolfcrypt-psa-benchmark
