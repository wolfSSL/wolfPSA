name: Version Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v5

      - name: Check version strings against wolfpsa/wolfpsa_version.h
        run: .github/scripts/check-version.sh
