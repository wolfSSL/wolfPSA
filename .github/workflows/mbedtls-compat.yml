name: Mbed TLS compatibility

on:
  push:
  pull_request:

jobs:
  # make MBEDTLS_COMPAT=1 mbedtls-compat-test: the Mbed TLS 4.x API on
  # wolfSSL, tested with our tests, Mbed TLS's sample programs and its ssl
  # suite. See the README.
  mbedtls-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The compatibility layer needs wolfSSL master, not a release
        wolfssl-ref: [ master ]
        options: [ "", "MBEDTLS_THREADING_C=1 ASAN=1" ]

    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config python3-jinja2 faketime

      - name: Clone sibling wolfSSL
        run: git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} https://github.com/wolfSSL/wolfssl ../wolfssl

      - name: Build and run the compatibility tests
        run: make MBEDTLS_COMPAT=1 ${{ matrix.options }} mbedtls-compat-test

      # -z defs fails on undefined symbols
      - name: Build client-only and server-only
        if: matrix.options == ''
        env:
          LDFLAGS: -Wl,-z,defs
        run: |
          for side in CLIENT SERVER; do
            make -j"$(nproc)" MBEDTLS_COMPAT=1 BUILD_DIR=build-no-$side \
              WOLFSSL_CPPFLAGS="-DWOLFSSL_USER_SETTINGS -DNO_WOLFSSL_$side" \
              want-surface-test
          done

  # make MBEDTLS_COMPAT=1 mbedtls-compat-suite-ref: the same ssl suite on Mbed
  # TLS's own libraries, where every case must pass. No wolfSSL.
  mbedtls-compat-suite-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-jinja2 python3-jsonschema

      - name: Build Mbed TLS and run the ssl suite on it
        run: make -j"$(nproc)" MBEDTLS_COMPAT=1 mbedtls-compat-suite-ref
