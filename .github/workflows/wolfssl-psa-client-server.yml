name: wolfSSL PSA Client Server

on:
  push:
  pull_request:

jobs:
  wolfssl-psa-client-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # master tracks upstream; the -stable tag is the release wolfPSA is
        # validated against. Bump it together with the wolfPSA version.
        wolfssl-ref: [ master, v5.9.4-stable ]

    steps:
      - name: Check out wolfPSA
        uses: actions/checkout@v4

      - name: Clone sibling wolfSSL
        run: git clone --depth 1 --branch ${{ matrix.wolfssl-ref }} https://github.com/wolfSSL/wolfssl ../wolfssl

      - name: Build wolfPSA
        run: make

      - name: Rebuild sibling wolfSSL with wolfPSA enabled
        run: make -C test rebuild-wolfssl-psa

      - name: Build wolfPSA test binaries
        run: make -C test

      - name: Run wolfPSA wolfSSL client-server test
        run: |
          rm -rf test/.store
          cd test
          ./run_psa_tls_server_client.sh
